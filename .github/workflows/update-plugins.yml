name: Auto-update Plugins & Tmux Settings

on:
  schedule:
    # Run every Sunday at 00:00 UTC
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-plugins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Update plugins and lazy-lock.json
        run: |
          nvim --headless "+Lazy! update" +qa

      - name: Check for changes
        id: git_diff
        run: |
          if git status --porcelain | grep -q 'lazy-lock.json'; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps:git_diff.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(plugins): auto-update plugins and tmux dependencies"
          title: "chore(plugins): auto-update plugins and tmux dependencies"
          body: |
            ### Automated Plugin & Lockfile Update 🤖

            This PR was automatically generated by the [Auto-update Plugins & Tmux Settings](https://github.com/${{ github.repository }}/actions/workflows/update-plugins.yml) workflow.

            - Updated `lazy-lock.json` with the latest plugin revisions (including `vim-tmux-navigator` and LazyVim dependencies).
            - Verified configuration loading via headless Neovim.
          branch: bot/auto-update-plugins
          delete-branch: true
          labels: |
            dependencies
            automated-pr
